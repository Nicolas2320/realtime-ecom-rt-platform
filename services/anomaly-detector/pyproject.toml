[project]
name = "anomaly-detector"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nicolas2320", email = "nicolasvalderramabarrera@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "psycopg[binary]==3.2.3",
]

[project.scripts]
anomaly-detector = "anomaly_detector:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
