[project]
name = "dashboard"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nicolas2320", email = "nicolasvalderramabarrera@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "streamlit==1.40.1",
    "streamlit-autorefresh==1.0.1",
]

[project.scripts]
dashboard = "dashboard:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
